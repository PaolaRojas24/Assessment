lane_follower_q:
  ros__parameters:
    # --- Platform ---
    platform: qcar

    # --- Topics ---
    target_point_topic: /lane_target_point_m
    cmd_topic: /lane_follower/raw_cmd

    # --- Ackermann geometry ---
    wheelbase: 0.256   # meters (distance between axles)

    # --- Dynamic lookahead ---
    # Shorter lookahead = tighter turns. Rule of thumb: lookahead_base ~ wheelbase.
    lookahead_min: 0.18
    lookahead_max: 0.40
    lookahead_base: 0.20
    lookahead_speed_gain: 0.80

    # --- Steering limits ---
    max_steering_angle: 0.50   # radians (~28.6 deg)
    curve_threshold: 0.30      # radians — above this = curve speed

    # --- Speed ---
    speed_straight: 0.070   # m/s on straight sections
    speed_curve: 0.085      # m/s in curves

    # Flip to +1.0 if the car steers in the wrong direction.
    steering_sign: -1.0
