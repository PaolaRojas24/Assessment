lane_follower_q:
  ros__parameters:
    # --- Platform ---
    platform: qcar

    # --- Topics ---
    target_point_topic: /lane_target_point_m
    cmd_topic: /lane_follower/raw_cmd

    # --- Ackermann geometry ---
    wheelbase: 0.256   # meters (distance between axles)

    # --- Dynamic lookahead ---
    # 0.22 m: compromise between tighter turns (0.20) and stability (0.30)
    lookahead_min: 0.18
    lookahead_max: 0.42
    lookahead_base: 0.22
    lookahead_speed_gain: 0.60


    # --- Steering limits ---
    max_steering_angle: 0.30   # tope físico real de la dirección del QCar (±0.3 rad)
    curve_threshold: 0.30

    # --- Speed ---
    speed_straight: 0.065   # m/s on straight sections
    speed_curve: 0.060    # m/s in curves

    # Flip to +1.0 if the car steers in the wrong direction.
    steering_sign: -1.0

    # EMA filter on steering output: 0.0=raw, 0.5=moderate, 0.8=heavy smoothing
    steering_lpf_alpha: 0.75