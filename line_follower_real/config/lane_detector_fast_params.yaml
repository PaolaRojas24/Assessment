lane_detector_fast:
  ros__parameters:
    # Listens directly on the decompressed topic; no relay in the path.
    subscribe_topic: /qcar/decompressed/csi_front
    target_point_topic: /lane_target_point_m

    # Visualization
    # `enable_display: true` opens cv2.imshow windows on the laptop. Each
    # imshow + waitKey takes ~10-20 ms inside the callback, so leave this
    # `false` when driving and use rqt_image_view on the overlay topic instead.
    enable_display: false
    overlay_topic: /qcar/line_follower/overlay
    # Bumped from 5 -> 15 Hz: same rate as the detector's input, so the
    # overlay/BEV publishers fire on every processed frame. This keeps the
    # local DDS link "warm" (analogous to the topic_hz keepalive trick used
    # on /qcar/csi_front) and gives the dashboard a smoother feed.
    overlay_publish_hz: 15.0
    overlay_width: 320
    overlay_height: 240

    # Camera intrinsics are rebuilt at runtime from these FoVs + the actual
    # frame size, so this YAML works at any resolution as long as the
    # pixel-domain params below match what the QCar is publishing.
    hfov_deg: 160.0
    vfov_deg: 120.0

    # All values below are tuned for csinode_lf publishing at 820x410.
    # If you go back down to 320x240, swap them for the scaled-down set
    # (commented out under each value).
    bev_pixels_per_meter: 500.0

    # Physical BEV target rectangle in meters — unchanged from the original.
    bev_dst_points_m:
      - 0.0
      - 0.0
      - 0.0
      - 0.103908
      - 0.434
      - 0.103908
      - 0.434
      - 0.0

    # ROI trapezoid in image pixels at 820x410 (the QCar's native CSI mode).
    # Order: bottom-left, top-left, top-right, bottom-right.
    roi_polygon_points_px:
      - 0.0
      - 410.0
      - 269.0
      - 239.0
      - 538.0
      - 239.0
      - 820.0
      - 410.0

    # Physical measurements — unchanged.
    camera_to_rear_axle_forward_m: 0.323
    camera_to_rear_axle_lateral_m: 0.0

    # Pixel-domain lane width at 820x410.
    lane_half_width_px: 50.0
    lane_half_width_ema_alpha: 0.2

    lane_lateral_bias: 0.25

    # Hough parameters at 820x410. Threshold and minLineLength scale with
    # image size because lane segments project to more pixels at higher res.
    hough_threshold: 50
    hough_min_line_length: 50
    hough_max_line_gap: 25
